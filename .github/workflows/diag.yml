name: diag
on: { push: { branches: [diag/social-login] } }
jobs:
  src:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir x && cd x && npm init -y >/dev/null
          npm install --silent @capgo/capacitor-social-login@7 >/dev/null
          d=node_modules/@capgo/capacitor-social-login/android/src/main/java/ee/forgr/capacitor/social/login
          echo "===== modified"; cat $d/ModifiedMainActivityForSocialLoginPlugin.java
          echo "===== consts"; grep -n "REQUEST_\|public static final\|handleGoogleLoginIntent" $d/GoogleProvider.java $d/SocialLoginPlugin.java | head -30
          echo "===== plugin annotations"; grep -n "@CapacitorPlugin\|name =\|@PluginMethod\|public void [a-zA-Z]*(PluginCall" $d/SocialLoginPlugin.java | head -30
          echo "===== initialize google"; grep -n -A25 "public void initialize(PluginCall" $d/SocialLoginPlugin.java | head -60
          echo "===== gradle"; cat node_modules/@capgo/capacitor-social-login/android/build.gradle | grep -n "implementation\|minSdk\|compileSdk" | head -20
          echo "===== capconfig"; grep -rn "providers\|getConfig" $d/SocialLoginPlugin.java | head -20
