name: Android app

# Builds Mimzi as an Android app (APK) and attaches it to a GitHub Release, so it
# can be downloaded straight from GitHub:
#   https://github.com/<owner>/<repo>/releases/latest/download/Mimzi.apk
# Signing: add repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD
# (see docs/ANDROID.md). Without them the APK is signed with a throwaway test key.
on:
  push:
    branches: [main, feature/symbol-libraries]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies (+ Capacitor wrapper and speech plugin)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/text-to-speech@6

      - name: Build the web app for Android
        env:
          VITE_OPENSYMBOLS_URL: 'off'
        run: npm run build

      - name: Create the Android project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cp android-app/capacitor.config.json capacitor.config.json
          npx cap add android
          npx cap sync android
          node android-app/prepare.mjs

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mimzi.jks"
            echo "SIGNED=permanent" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets yet — using a throwaway test key. Updates will need an uninstall until the secrets are added (see docs/ANDROID.md)."
            KS_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/mimzi.jks" -alias mimzi -keyalg RSA -keysize 2048 -validity 3650 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Mimzi test build"
            echo "SIGNED=test" >> "$GITHUB_ENV"
          fi
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/mimzi.jks" --ks-key-alias mimzi --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out Mimzi.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify Mimzi.apk
          rm -f "$RUNNER_TEMP/mimzi.jks"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Mimzi-apk
          path: Mimzi.apk

      - name: Publish a GitHub Release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v0.1.${{ github.run_number }}"
          NOTE="Mimzi for Android tablets, build ${{ github.run_number }} from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}).

          Install: download Mimzi.apk on the tablet, open it, and allow \"Install unknown apps\" for your browser when Android asks."
          if [ "$SIGNED" = "test" ]; then NOTE="$NOTE

          ⚠️ Test build: signed with a temporary key. Installing a later build will need Mimzi uninstalled first (which clears its data)."; fi
          gh release create "$TAG" Mimzi.apk --target "$GITHUB_SHA" --title "Mimzi Android build ${{ github.run_number }}" --notes "$NOTE" --latest
