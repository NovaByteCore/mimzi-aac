name: GitHub Pages

# Publishes Mimzi to https://<owner>.github.io/<repo>/ (free GitHub Pages).
# One-time setup by the repo owner: Settings → Pages → Source "Deploy from a branch",
# Branch "gh-pages" / "(root)".
on:
  push:
    branches: [main, feature/symbol-libraries]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # No server on GitHub Pages: OpenSymbols search says so instead of failing.
          VITE_OPENSYMBOLS_URL: 'off'
          # Google sign-in (Drive sync, Google Photos). An OAuth web client ID is public by design —
          # it's in every page that uses Google sign-in — so it lives here, not in a secret.
          # Google Cloud project "Mimzi" (mimzi-515301), client "Mimzi web app"; authorised origins:
          # https://novabytecore.github.io and https://mimzi-aac.netlify.app. A repository variable
          # VITE_GOOGLE_CLIENT_ID, if set, takes precedence.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '527349701354-utcfdgh696gnfd80fpfu8uo2tk6oh1d0.apps.googleusercontent.com' }}
        run: npm run build

      - name: Check the build uses the Pages folder
        run: grep -q '/${{ github.event.repository.name }}/assets/' dist/index.html

      - name: Publish to the gh-pages branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
